<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TIB Referenzen</title>
<style>
:root{--ink:#1a1a1a;--mute:#8a8a8a;--line:#e7e7e7;--bg:#fff;--tile:#f4f4f2;--acc:#1a1a1a}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
.top{position:sticky;top:0;z-index:3;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;padding:12px 24px}
.bar h1{margin:0;font-size:18px;font-weight:600;margin-right:auto}
.bar a{text-decoration:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);border-radius:14px;padding:3px 11px}
.chips button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
#q{border:1px solid var(--line);border-radius:14px;padding:4px 11px;font:inherit;width:180px}
.cols,.row{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.cols{padding:6px 24px 8px;color:var(--mute);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
main{padding:0 24px 80px}
h2{font-size:40px;font-weight:600;letter-spacing:-.02em;margin:56px 0 4px}
.sub{color:var(--mute);margin:0 0 8px}
.ref{padding:26px 0 28px;border-top:1px solid var(--line)}
.ref header{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 16px;margin-bottom:12px}
.ref h3{margin:0;font-size:17px;font-weight:600}
.meta{color:var(--ink)}
.tags{color:var(--mute)}
.tag{display:inline-block;border:1px solid var(--ink);border-radius:10px;padding:0 7px;font-size:11px;margin-right:6px}
.note{flex-basis:100%;color:var(--mute);margin:2px 0 0}
figure{margin:0;min-width:0}
.box{position:relative;aspect-ratio:4/3;background:#fff;outline:1px solid var(--line);overflow:hidden;cursor:zoom-in}
.box img{display:block;width:100%;height:100%;object-fit:contain}
.photo .box img{object-fit:cover}
.box.none{background:var(--tile);cursor:default;display:flex;align-items:center;justify-content:center;color:var(--mute)}
figcaption{margin-top:6px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.alt{position:absolute;right:6px;top:6px;display:flex;gap:2px;z-index:1}
.alt button{background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:9px;padding:0 7px;font-size:11px}
.alt button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.empty{color:var(--mute);padding:40px 0}
/* ratings: my stars + note, everyone else's below */
.rate{flex-basis:100%;display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;margin-top:6px}
.stars button{font-size:18px;line-height:1;color:#d0d0d0;padding:0 1px}
.stars button[aria-pressed=true],.stars:hover button{color:var(--ink)}
.stars button:hover~button{color:#d0d0d0}
.avg{color:var(--mute)}
.mynote{flex:1;min-width:180px;max-width:520px;border:1px solid var(--line);border-radius:14px;padding:3px 11px;font:inherit}
.rnote{flex-basis:100%;margin:0}
.rnote b{font-weight:600;margin-right:6px}
/* lightbox */
dialog{border:0;padding:0;margin:0;width:100vw;height:100vh;max-width:none;max-height:none;background:#fff}
dialog::backdrop{background:#fff}
.lb{display:flex;flex-direction:column;height:100%}
.lb .bar{border-bottom:1px solid var(--line)}
.lb .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb .stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:16px}
.lb img{max-width:100%;max-height:100%;object-fit:contain}
@media (max-width:760px){
  .top{position:static}
  .bar,.cols{padding-left:16px;padding-right:16px} main{padding:0 16px 60px}
  .cols{display:none}
  .row{grid-template-columns:repeat(2,minmax(0,1fr))}
  h2{font-size:28px} #q{width:100%}
}
</style>
</head>
<body>
<div class="top">
  <div class="bar">
    <h1>Referenzen · Bibliotheken</h1>
    <div class="chips" id="filters"></div>
    <div class="chips" id="starf" aria-label="Nach Sternen filtern"></div>
    <input id="q" type="search" placeholder="Suchen: Stadt, Architekt …" aria-label="Suchen">
    <a href="../geschossverbindungen/index.html">Geschosse verbinden ↗</a>
    <a href="../../index.html">← Board</a>
  </div>
  <div class="cols" aria-hidden="true"><span>Erdgeschoss</span><span>Regelgeschoss</span><span>Schnitt</span><span>Außen</span><span>Innen</span><span>Innen</span></div>
</div>
<main id="list"></main>
<dialog id="lb"><div class="lb">
  <div class="bar"><button id="lbprev" aria-label="Vorheriges Bild">←</button><button id="lbnext" aria-label="Nächstes Bild">→</button>
    <span class="t" id="lbt"></span><a id="lbsrc" target="_blank" rel="noopener">Quelle ↗</a><button id="lbclose" aria-label="Schließen">✕</button></div>
  <div class="stage"><img id="lbimg" alt=""></div>
</div></dialog>
<script>
const CATS = {national: ["Nationalbibliotheken", "Große Bestände, Magazin + Lesesäle", "National"],
  gross: ["Große öffentliche Bibliotheken", "Stadt-/Zentralbibliotheken", "Groß öffentlich"],
  klein: ["Kleine öffentliche Bibliotheken", "Stadtteil- und Stadtbibliotheken", "Klein öffentlich"],
  uni: ["Universitätsbibliotheken", "Hochschul- und Landesbibliotheken", "Universität"],
  kollektiv: ["Kollektivräume im Bestand", "Keine Bibliotheken: Umbauten mit kleinem Eingriff (As Found)", "Kollektivraum"]};
const COLS = [["eg", "Erdgeschoss"], ["og", "Regelgeschoss"], ["schnitt", "Schnitt"],
  ["aussen", "Außen"], ["innen1", "Innen"], ["innen2", "Innen"]];
const FILTERS = [["alle", "Alle"], ["kt", "Kempe Thill"], ["umbau", "Umbau / Bestand"], ["buch", "Entwurfsatlas"], ...Object.entries(CATS).map(([k, v]) => [k, v[2]])];
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const $ = id => document.getElementById(id);
let DATA = [], filter = "alle", stars = new Set(), lbList = [], lbI = 0;  // stars: picked rounded averages, 0 = unrated; empty = all
const requestedFilter = new URLSearchParams(location.search).get("filter");
if (FILTERS.some(([key]) => key === requestedFilter)) filter = requestedFilter;
const avgStars = slug => { const s = Object.values(RATINGS[slug] || {}).map(r => r.stars).filter(Boolean);
  return s.length ? Math.round(s.reduce((a, b) => a + b, 0) / s.length) : 0; };

const src = (p, role) => `img/${p.slug}/${role}.webp`;
function cell(p, role, name) {
  const im = p.images[role];
  if (!im) return `<figure><div class="box none">–</div><figcaption>${name} fehlt</figcaption></figure>`;
  const kind = ["aussen", "innen1", "innen2"].includes(role) ? "photo" : "plan";
  // the optional extra plan shares the Regelgeschoss cell, so every row keeps the same six columns
  const alt = role === "og" && p.images.og2
    ? `<div class="alt"><button aria-pressed="true" data-r="og">1</button><button aria-pressed="false" data-r="og2">2</button></div>` : "";
  return `<figure class="${kind}" data-slug="${p.slug}" data-role="${role}"><div class="box">${alt}
    <img loading="lazy" src="${src(p, role)}" alt="${esc(p.title)} – ${esc(im.label || name)}"></div>
    <figcaption title="${esc(im.label)}">${esc(im.label || name)}</figcaption></figure>`;
}
function project(p) {
  const tags = [p.kt ? `<a class="tag" href="../kempe-thill/index.html#referenzen">Kempe Thill</a>` : "",
    p.umbau ? `<span class="tag">Umbau / Bestand</span>` : "",
    p.book_page ? `Entwurfsatlas S. ${p.book_page}` : ""].join("");
  return `<article class="ref" id="${p.slug}"><header><h3>${esc(p.title)}</h3>
    <span class="meta">${esc(p.city)}, ${esc(p.country)} · ${esc(p.architect)}${p.year ? " · " + p.year : ""}</span>
    <span class="tags">${tags}</span>${p.link ? `<a class="tag" href="${esc(p.link)}" target="_blank" rel="noopener">${esc(new URL(p.link).hostname.replace(/^www\./, ""))} ↗</a>` : ""}${p.note ? `<p class="note">${esc(p.note)}</p>` : ""}${p.relevance ? `<p class="note">Für die TIB: ${esc(p.relevance)}</p>` : ""}${rateBox(p.slug)}</header>
    <div class="row">${COLS.map(([r, n]) => cell(p, r, n)).join("")}</div></article>`;
}
function render() {
  const q = $("q").value.trim().toLowerCase();
  const show = DATA.filter(p => (filter === "alle" || (filter === "kt" && p.kt) || (filter === "umbau" && p.umbau) || (filter === "buch" && p.book_page) || p.category === filter)
    && (!stars.size || stars.has(avgStars(p.slug)))
    && (!q || [p.title, p.city, p.country, p.architect].join(" ").toLowerCase().includes(q)));
  $("list").innerHTML = Object.entries(CATS).map(([k, [t, s]]) => {
    const ps = show.filter(p => p.category === k);
    return ps.length ? `<h2>${t}</h2><p class="sub">${s} · ${ps.length} Projekte</p>${ps.map(project).join("")}` : "";
  }).join("") || `<p class="empty">Keine Projekte gefunden.</p>`;
}
function openLb(slug, role) {
  const p = DATA.find(x => x.slug === slug);
  lbList = ["eg", "og", "og2", "schnitt", "aussen", "innen1", "innen2"].filter(r => p.images[r]).map(r => [p, r]);
  lbI = Math.max(0, lbList.findIndex(([, r]) => r === role));
  showLb(); $("lb").showModal();
}
function showLb() {
  const [p, r] = lbList[lbI], im = p.images[r];
  $("lbimg").src = src(p, r); $("lbimg").alt = `${p.title} – ${im.label}`;
  $("lbt").textContent = `${p.title} · ${im.label}  (${lbI + 1}/${lbList.length})`;
  const url = (im.src || "").split(" · ")[0];
  $("lbsrc").hidden = !url; $("lbsrc").href = url; $("lbsrc").title = im.src;
}
const step = d => { lbI = (lbI + d + lbList.length) % lbList.length; showLb(); };

$("filters").innerHTML = FILTERS.map(([k, t]) => `<button data-f="${k}" aria-pressed="${k === filter}">${t}</button>`).join("");
$("filters").onclick = e => { const b = e.target.closest("button"); if (!b) return;
  filter = b.dataset.f; for (const x of $("filters").children) x.setAttribute("aria-pressed", x === b);
  const url = new URL(location.href); filter === "alle" ? url.searchParams.delete("filter") : url.searchParams.set("filter", filter);
  history.replaceState(null, "", url); render(); };
$("starf").innerHTML = ["Unbewertet", "1★", "2★", "3★", "4★", "5★"].map((t, n) => `<button data-s="${n}" aria-pressed="false">${t}</button>`).join("");
$("starf").onclick = e => { const b = e.target.closest("button"); if (!b) return;  // several at once; none = all
  const n = +b.dataset.s; stars.has(n) ? stars.delete(n) : stars.add(n); b.setAttribute("aria-pressed", stars.has(n)); render(); };
$("q").oninput = render;
$("list").onclick = e => {
  const alt = e.target.closest(".alt button");
  if (alt) {  // swap Regelgeschoss <-> extra plan in place
    const fig = alt.closest("figure"), p = DATA.find(x => x.slug === fig.dataset.slug), r = alt.dataset.r;
    fig.dataset.role = r; fig.querySelector("img").src = src(p, r);
    fig.querySelector("figcaption").textContent = p.images[r].label;
    for (const b of alt.parentNode.children) b.setAttribute("aria-pressed", b === alt);
    return;
  }
  const star = e.target.closest(".stars button");
  if (star) {  // clicking your current rating again clears it
    const slug = star.closest(".rate").dataset.slug, s = +star.dataset.s;
    return rate(slug, { stars: RATINGS[slug]?.[me]?.stars === s ? 0 : s });
  }
  const fig = e.target.closest("figure[data-role]"); if (fig) openLb(fig.dataset.slug, fig.dataset.role);
};
$("list").addEventListener("change", e => {
  if (e.target.matches(".mynote")) rate(e.target.closest(".rate").dataset.slug, { note: e.target.value.trim() });
});
$("lbprev").onclick = () => step(-1); $("lbnext").onclick = () => step(1); $("lbclose").onclick = () => $("lb").close();
$("lb").addEventListener("keydown", e => { if (e.key === "ArrowLeft") step(-1); if (e.key === "ArrowRight") step(1); });
$("lbimg").onclick = () => $("lb").close();

/* ---------- ratings: ratings.json in the repo, {slug: {name: {stars, note}}}; saved with the board's GitHub token ---------- */
const GH = location.hostname.match(/^([^.]+)\.github\.io$/);
const REPO = GH && `https://api.github.com/repos/${GH[1]}/${location.pathname.split("/")[1]}/`;
const RFILE = "contents/html/referenzen/ratings.json";
let token = localStorage.getItem("gh-token"), me = localStorage.getItem("ref-name") || "", RATINGS = {}, saving = false;
const b64 = s => btoa(String.fromCharCode(...new TextEncoder().encode(s)));
const unb64 = s => new TextDecoder().decode(Uint8Array.from(atob(s), c => c.charCodeAt(0)));
async function gh(path, opt = {}) {  // 409 (someone saved first) is left to the caller
  if (!token && (token = prompt("GitHub-Token (nur für dieses Repo, Contents: write):"))) localStorage.setItem("gh-token", token);
  if (!token) throw new Error("kein Token");
  const r = await fetch(REPO + path, { cache: "no-cache", ...opt, headers: { Authorization: `Bearer ${token}`, Accept: "application/vnd.github+json" } });
  if (r.status === 401) { localStorage.removeItem("gh-token"); token = null; throw new Error("Token ungültig"); }
  if (!r.ok && r.status !== 409) throw new Error(r.status + " " + (await r.text()).slice(0, 120));
  return r;
}
async function remoteRatings() {
  const f = await (await gh(RFILE)).json();
  return { sha: f.sha, data: JSON.parse(unb64(f.content)) };
}
function rateBox(slug) {
  const all = Object.entries(RATINGS[slug] || {}), mine = RATINGS[slug]?.[me] || {};
  const rated = all.filter(([, r]) => r.stars), avg = rated.reduce((s, [, r]) => s + r.stars, 0) / (rated.length || 1);
  return `<div class="rate" data-slug="${slug}"><span class="stars" title="Deine Bewertung">${[1, 2, 3, 4, 5].map(n =>
      `<button data-s="${n}" aria-label="${n} Sterne" aria-pressed="${n <= (mine.stars || 0)}">★</button>`).join("")}</span>
    <span class="avg">${rated.length ? `Ø ${avg.toFixed(1)} · ${rated.length} ${rated.length > 1 ? "Bewertungen" : "Bewertung"}` : "noch nicht bewertet"}</span>
    <input class="mynote" placeholder="Deine Notiz …" aria-label="Deine Notiz" value="${esc(mine.note)}">
    ${all.filter(([n, r]) => n !== me && (r.stars || r.note)).map(([n, r]) =>
      `<p class="rnote"><b>${esc(n)}</b>${r.stars ? "★".repeat(r.stars) + " " : ""}${esc(r.note)}</p>`).join("")}</div>`;
}
const redraw = slug => { const box = document.querySelector(`.rate[data-slug="${slug}"]`); if (box) box.outerHTML = rateBox(slug); };
async function rate(slug, patch) {
  if (!REPO) return alert("Bewerten geht nur auf der GitHub-Seite.");
  if (!me && !(me = (prompt("Dein Name (steht bei deinen Bewertungen):") || "").trim())) return;
  localStorage.setItem("ref-name", me);
  const put = d => (d[slug] = { ...d[slug], [me]: { ...d[slug]?.[me], ...patch } }, d);
  put(RATINGS); redraw(slug);  // show it at once, then write it on top of the newest file
  saving = true;
  try {
    for (let n = 0; n < 5; n++) {
      const { sha, data } = await remoteRatings();
      const r = await gh(RFILE, { method: "PUT", body: JSON.stringify({ message: "Referenz-Bewertung", sha,
        content: b64(JSON.stringify(put(data), null, 1)) }) });
      if (r.ok) { RATINGS = data; return; }
    }
    throw new Error("zu viele gleichzeitige Änderungen");
  } catch (err) { alert("Bewertung nicht gespeichert: " + err.message); }
  finally { saving = false; Object.keys(RATINGS).forEach(redraw); }
}
async function pollRatings() {  // editors read the repo, viewers the Pages copy (~1 min behind)
  if (document.hidden || saving || document.activeElement?.matches(".mynote")) return;
  try {
    const d = REPO && token ? (await remoteRatings()).data : await (await fetch("ratings.json", { cache: "no-cache" })).json();
    if (JSON.stringify(d) !== JSON.stringify(RATINGS)) { RATINGS = d; render(); }
  } catch (err) { console.warn("ratings", err); }
}
setInterval(pollRatings, 20000);

Promise.all([fetch("data.json", { cache: "no-cache" }).then(r => r.json()),
  fetch("ratings.json", { cache: "no-cache" }).then(r => r.ok ? r.json() : {}).catch(() => ({}))])
  .then(([d, r]) => { DATA = d; RATINGS = r; render(); if (location.hash) document.querySelector(location.hash)?.scrollIntoView(); });
</script>
</body>
</html>
