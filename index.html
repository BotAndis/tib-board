<style>
:root{--ink:#1a1a1a;--mute:#8a8a8a;--line:#e7e7e7;--bg:#fff;--tile:#f4f4f2}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);

.tile{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px;height:100%;

<script type="module">
const PDFJS = "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/build/pdf.min.mjs";
const PDFJS_WORKER = "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/build/pdf.worker.min.mjs";
let editing = false;  // the lock button turns edit mode on: move, resize, rename, drop files
const $ = (s, r = document) => r.querySelector(s);
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dlLink = it => it.dl ? `<a class="dl" href="${esc(it.dl)}">Download</a>` : "";
const mb = n => n > 1e6 ? (n / 1e6).toFixed(1) + " MB" : Math.max(1, Math.round(n / 1e3)) + " KB";

/* ---------- pan / zoom ---------- */
class View {
  constructor(host, world, { onChange, onClick, onDrag, min = 0.03, max = 40 } = {}) {
    Object.assign(this, { host, world, onChange, onClick, onDrag, min, max, x: 0, y: 0, s: 1, gen: 0 });
    const pts = new Map(); let start = null, moved = 0, drag = null, pinch = null;
    host.addEventListener("pointerdown", e => {
      if (e.button > 1) return;
      const mid = e.button === 1;  // middle button always pans: never drags an item or clicks
      host.setPointerCapture(e.pointerId);
      pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (pts.size === 1) { start = mid ? null : { x: e.clientX, y: e.clientY, t: e.target }; moved = 0; drag = mid ? null : onDrag?.(e) || null; }
      if (pts.size === 2) { drag = null; const [a, b] = [...pts.values()]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y) }; }
    });
    host.addEventListener("pointermove", e => {
      const p = pts.get(e.pointerId); if (!p) return;
      const dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY;
      moved += Math.abs(dx) + Math.abs(dy);
      if (pts.size === 2) {
        const [a, b] = [...pts.values()], d = Math.hypot(a.x - b.x, a.y - b.y), r = host.getBoundingClientRect();
        this.x += dx / 2; this.y += dy / 2;
        this.zoomAt((a.x + b.x) / 2 - r.left, (a.y + b.y) / 2 - r.top, d / pinch.d); pinch.d = d;
      } else if (drag) drag.move(dx / this.s, dy / this.s, e);
      else { host.classList.add("panning"); this.x += dx; this.y += dy; this.apply(); }
    });
    const up = e => {
      if (!pts.delete(e.pointerId)) return;
      host.classList.remove("panning");
      if (pts.size === 0) { if (drag) drag.end?.(); else if (moved < 6 && start) onClick?.(start.t, e); drag = null; start = null; pinch = null; }
    };
    host.addEventListener("pointerup", up); host.addEventListener("pointercancel", up);
    host.addEventListener("mousedown", e => { if (e.button === 1) e.preventDefault(); });  // no browser autoscroll
    host.addEventListener("wheel", e => {
      e.preventDefault();
      const r = host.getBoundingClientRect();
      // mouse wheel (big integer steps) and pinch (ctrlKey) zoom; trackpad two-finger scroll pans
      const zoom = e.ctrlKey || e.deltaMode === 1 || (e.deltaX === 0 && Math.abs(e.deltaY) >= 50 && Number.isInteger(e.deltaY));
      if (zoom) this.zoomAt(e.clientX - r.left, e.clientY - r.top, Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0016)));
      else { this.x -= e.deltaX; this.y -= e.deltaY; this.apply(); }
    }, { passive: false });
  }
  zoomAt(cx, cy, f) {
    const s = Math.min(this.max, Math.max(this.min, this.s * f));
    this.x = cx - (cx - this.x) * (s / this.s); this.y = cy - (cy - this.y) * (s / this.s); this.s = s; this.apply();
  }
  fit(w, h, pad = 24, top = false) {
    const r = this.host.getBoundingClientRect();
    this.s = Math.min((r.width - 2 * pad) / w, (r.height - 2 * pad) / h);
    this.x = (r.width - w * this.s) / 2; this.y = top ? pad : (r.height - h * this.s) / 2; this.apply();
  }
  apply() {
    this.world.style.transform = `translate(${this.x}px,${this.y}px) scale(${this.s})`;
    this.gen++; clearTimeout(this.t); this.t = setTimeout(() => this.onChange?.(), 160);
  }
}

/* ---------- PDF: sharp re-render of only the visible part ---------- */
let pdfjsP;
const pdfjs = () => pdfjsP ??= import(PDFJS).then(m => { m.GlobalWorkerOptions.workerSrc = PDFJS_WORKER; return m; });
const docs = new Map();
function getDoc(url) {
  let p = docs.get(url);
  if (p) docs.delete(url);  // move to the end (LRU)
  else p = pdfjs().then(m => m.getDocument({ url, disableRange: true, disableStream: true, isEvalSupported: false }).promise);
  docs.set(url, p);
  if (docs.size > 8) { const [k, old] = docs.entries().next().value; docs.delete(k); old.then(d => d.destroy()).catch(() => {}); }
  return p;
}
// targets: [{box, page: () => Promise<PDFPage>, minPx}] ; renders sequentially, aborts when the view moves again
async function sharpen(view, targets) {
  const gen = view.gen, hr = view.host.getBoundingClientRect(), dpr = devicePixelRatio || 1;
  for (const t of targets) {
    const r = t.box.getBoundingClientRect(), old = t.box.querySelector("canvas.hi");
    const x0 = Math.max(r.left, hr.left), y0 = Math.max(r.top, hr.top), x1 = Math.min(r.right, hr.right), y1 = Math.min(r.bottom, hr.bottom);
    if (x1 <= x0 || y1 <= y0 || r.width * dpr < t.minPx) { old?.remove(); continue; }
    try {
      const page = await t.page();
      if (gen !== view.gen) return;
      const w1 = page.getViewport({ scale: 1 }).width, vp = page.getViewport({ scale: r.width * dpr / w1 });
      const c = el("canvas", "hi"); c.width = Math.round((x1 - x0) * dpr); c.height = Math.round((y1 - y0) * dpr);
      Object.assign(c.style, { left: (x0 - r.left) / r.width * 100 + "%", top: (y0 - r.top) / r.height * 100 + "%",
        width: (x1 - x0) / r.width * 100 + "%", height: (y1 - y0) / r.height * 100 + "%" });
      const task = page.render({ canvasContext: c.getContext("2d"), viewport: vp, background: "#fff", optionalContentConfigPromise: t.oc,
        transform: [1, 0, 0, 1, -(x0 - r.left) * dpr, -(y0 - r.top) * dpr] });
      view.tasks = (view.tasks || []).concat(task);
      await task.promise;
      if (gen !== view.gen) return;
      old?.remove(); t.box.append(c);
    } catch (err) { if (err?.name !== "RenderingCancelledException") console.warn("pdf", err); return; }
  }
}
const cancelTasks = v => { (v.tasks || []).forEach(t => t.cancel()); v.tasks = []; };

/* ---------- 3D ---------- */
let threeP;
const three = () => threeP ??= Promise.all([import("three"), import("three/addons/controls/OrbitControls.js"),
  import("three/addons/loaders/STLLoader.js"), import("three/addons/loaders/GLTFLoader.js"), import("three/addons/loaders/3MFLoader.js")])
  .then(([T, { OrbitControls }, { STLLoader }, { GLTFLoader }, { ThreeMFLoader }]) => ({ T, OrbitControls, STLLoader, GLTFLoader, ThreeMFLoader }));
const models = new Map();
function loadModel(item) {
  if (!models.has(item.url)) models.set(item.url, (async () => {
    const L = await three(), { T } = L, buf = await (await fetch(item.url)).arrayBuffer();
    let obj;
    if (item.ext === "glb") obj = (await new L.GLTFLoader().parseAsync(buf, "")).scene;
    else {
      obj = item.ext === "3mf" ? new L.ThreeMFLoader().parse(buf) : new T.Mesh(new L.STLLoader().parse(buf));
      obj.rotation.x = -Math.PI / 2;  // print files are Z-up
      obj.traverse(o => {
        if (!o.isMesh) return;
        o.geometry.computeVertexNormals();
        o.material = new T.MeshStandardMaterial({ color: 0xebe9e4, roughness: .95, flatShading: true });
        if (o.geometry.attributes.position.count < 1.2e6)
          o.add(new T.LineSegments(new T.EdgesGeometry(o.geometry, 30), new T.LineBasicMaterial({ color: 0x3a3a3a })));
      });
    }
    return obj;
  })());
  return models.get(item.url);
}
function stage(L, obj, w, h, renderer) {
  const { T } = L, scene = new T.Scene(); scene.background = new T.Color(0xffffff);
  scene.add(obj, new T.HemisphereLight(0xffffff, 0xb5b5b5, 2.2));
  const box = new T.Box3().setFromObject(obj), size = box.getSize(new T.Vector3()).length() || 1, c = box.getCenter(new T.Vector3());
  const sun = new T.DirectionalLight(0xffffff, 1.6); sun.position.set(c.x + size, c.y + size * 1.4, c.z + size * .6); scene.add(sun);
  const cam = new T.PerspectiveCamera(30, w / h, size / 500, size * 20);
  cam.position.copy(c).add(new T.Vector3(1, .75, 1).normalize().multiplyScalar(size * 1.55 * Math.max(1, h / w))); cam.lookAt(c);
  renderer.setSize(w, h, false);
  return { scene, cam, c };
}
let thumbR;
const modelThumbs = [];
async function modelThumb(item, img) {  // one shared renderer, one card at a time
  const L = await three(), obj = (await loadModel(item)).clone();
  thumbR ??= new L.T.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  thumbR.setPixelRatio(1);
  const { scene, cam } = stage(L, obj, 600, 600, thumbR);
  thumbR.render(scene, cam); img.src = thumbR.domElement.toDataURL("image/webp", .85);
}
let thumbQ = Promise.resolve();

/* ---------- board ---------- */
let boardText = await (await fetch("board.json", { cache: "no-cache" })).text();
const board = JSON.parse(boardText);
const host = $("#board"), world = $("#world");
const pdfTargets = [];

// a fresh upload reaches Pages ~1 min after its commit: retry a missing thumbnail for a while
function thumbImg(src) {
  const i = Object.assign(el("img"), { src, loading: "lazy", alt: "" });
  let n = 0; i.onerror = () => ++n < 15 && setTimeout(() => i.src = `${src}?r=${n}`, 20000);
  return i;
}

function media(item, big) {
  const m = el("div", "media");
  if (item.kind === "stack") {
    const mo = el("div", "mosaic");
    for (const c of item.items.slice(0, 4)) mo.append(c.thumb ? thumbImg(c.thumb) : el("div", "", esc(c.ext)));
    m.append(mo, el("span", "count", item.items.length));
  } else if (item.live) m.append(Object.assign(el("iframe"), { src: item.url, scrolling: "no", tabIndex: -1 }));
  else if (item.thumb) m.append(thumbImg(item.thumb));
  else if (item.kind === "model" && item.url) {
    const img = el("img"); m.append(el("div", "tile", "3D"), img);

function sync(mine, theirs, make) {

    const e = make(n); o ? o.el.replaceWith(e) : world.append(e);

/* ---------- GitHub: the repo is the shared store; editors share one token (Contents: write, this repo only) ---------- */
const GH = location.hostname.match(/^([^.]+)\.github\.io$/);
const REPO = GH && `https://api.github.com/repos/${GH[1]}/${location.pathname.split("/")[1]}/`;
let token = localStorage.getItem("gh-token");

function login() {
  if (!token && (token = prompt("GitHub-Token (nur für dieses Repo, Contents: write):"))) localStorage.setItem("gh-token", token);
  return token;
}
async function gh(path, opt = {}) {  // 409 / 422 (someone saved first, name taken) are left to the caller
  if (!login()) throw new Error("kein Token");
  const r = await fetch(REPO + path, { cache: "no-cache", ...opt, headers: { Authorization: `Bearer ${token}`, Accept: "application/vnd.github+json" } });
  if (r.status === 401) { localStorage.removeItem("gh-token"); token = null; throw new Error("Token ungültig"); }
  if (!r.ok && r.status !== 409 && r.status !== 422) throw new Error(r.status + " " + (await r.text()).slice(0, 120));

}
async function remote() {  // newest board.json in the repo; GitHub sends the content inline only up to 1 MB
  const f = await (await gh("contents/board.json")).json();
  return { sha: f.sha, board: JSON.parse(unb64(f.content || (await (await gh("git/blobs/" + f.sha)).json()).content)) };
}

async function poll() {
  if (document.hidden || saving) return;
  try {
    if (REPO && token) {
      const { sha, board: nb } = await remote();
      if (sha !== known) { apply(nb); known = sha; }
    } else {  // viewers: the Pages copy, ~1 min behind the repo
      const t = await (await fetch("board.json", { cache: "no-cache" })).text();
      if (t !== boardText) { boardText = t; apply(JSON.parse(t)); }
    }
  } catch (err) { console.warn("live", err); }
}
setTimeout(function tick() { poll(); setTimeout(tick, REPO && token ? 5000 : 30000); }, 5000);  // a token can come later

/* ---------- edit mode (?edit): move / resize, rename labels, drop files; every change saves itself ---------- */
const btn = el("button", "", "Speichern"); btn.id = "save";
// my unsaved changes on top of the newest board.json: only what was changed here is written, so parallel
// editors keep each other's work; if someone saved in between, GitHub refuses the stale sha (409) and we redo it
async function push() {
  for (let n = 1; ; n++) {
    const ids = new Map(dirty), { sha, board: nb } = await remote();
    const mine = new Map([...board.items, ...board.labels].map(i => [i.id, i]));
    for (const o of [...nb.items, ...nb.labels]) {
      const m = ids.has(o.id) && mine.get(o.id);
      if (m) for (const k of ["x", "y", "w", "text", "moved"]) if (k in m) o[k] = m[k];
    }
    for (const id of ids.keys()) if ((mine.get(id)?.upload || mine.get(id)?.hp) && !nb.items.some(i => i.id === id)) nb.items.push(strip(mine.get(id)));
    nb.items = nb.items.filter(i => !gone.has(i.id));
    if (board.walls.some(w => ids.has(w.id))) nb.walls = board.walls.map(strip);
    const r = await gh("contents/board.json", { method: "PUT", body: JSON.stringify({ message: "Board-Layout", sha,
      content: b64(new TextEncoder().encode(JSON.stringify(nb, null, 1))) }) });
    if (r.ok) {
      for (const [id, v] of ids) if (dirty.get(id) === v) dirty.delete(id);
      known = (await r.json()).content.sha; apply(nb); return;
    }
    if (n === 5) throw new Error("wird gerade woanders gespeichert");

  if (!now) { timer = setTimeout(save, 1500, true); return; }
  if (saving) { again = true; return; }
  btn.textContent = "Speichert …";
  saving = push().then(() => { btn.textContent = "Gespeichert ✓"; }, err => { btn.textContent = `Fehler: ${err.message} · nochmal`; })
    .finally(() => { saving = null; if (again) { again = false; save(true); } });

async function putNew(path, blob) {  // never replaces a file in the repo: a taken name gets _2, _3 …
  const content = b64(new Uint8Array(await blob.arrayBuffer()));
  for (let n = 1; n <= 20; n++) {
    const p = n === 1 ? path : path.replace(/(\.\w+)?$/, `_${n}$1`);
    const r = await gh("contents/" + p.split("/").map(encodeURIComponent).join("/"),
      { method: "PUT", body: JSON.stringify({ message: "Upload " + p, content }) });
    if (r.ok) return p;
    const msg = await r.text();
    if (r.status !== 422 || !msg.includes("sha")) throw new Error(r.status + " " + msg.slice(0, 120));  // not a name clash
  }

}

    const page = await doc.getPage(1), v1 = page.getViewport({ scale: 1 }); pt = v1.width;

  if (t) Object.assign(it, { ar: t.ar, w: Math.round(300 * t.ar), thumb: URL.createObjectURL(t.blob) });
  if (old) {

  c.style.left = it.x + "px"; c.style.top = it.y + "px"; c.style.width = m.style.width = it.w + "px"; m.style.height = it.w / (it.ar || 1) + "px"; c.style.setProperty("--h", m.style.height);
}
function undo() {
  const u = undos.pop(); undoBtn.hidden = !undos.length;
  if (u?.removed) { gone.delete(u.id); board.items.push(u.removed); world.append(u.removed.el = card(u.removed)); touch(u.id); save(); return; }
  const o = u && [...board.items, ...board.labels].find(i => i.id === u.id); if (!o) return;
  if (!u.before) { gone.add(o.id); o.el.remove(); board.items.splice(board.items.indexOf(o), 1); }
  else {
    Object.assign(o, u.before);
    if (o.el.lab) { o.el.textContent = o.text; o.el.style.left = o.x + "px"; o.el.style.top = o.y + "px"; } else setBox(o);
  }
  touch(o.id); save();
}

// selection for Strg+C: click picks one card, Shift+click adds or removes, a click on empty board clears
const sel = new Set();
function select(t, e) {
  const c = t.closest?.(".card");
  if (!e?.shiftKey) { for (const s of sel) s.el.classList.remove("sel"); sel.clear(); }
  if (!c) return;
  if (sel.has(c.item)) { sel.delete(c.item); c.classList.remove("sel"); } else { sel.add(c.item); c.classList.add("sel"); }
}

/* ---------- Hängeplan: the wall is in mm, sheets hang at paper size and snap to each other ---------- */
const EYE = 1550, GAP = 100;  // sheet centres at eye height above the floor; gap between sheets until the wall has its own rhythm
const wallAt = (x, y) => board.walls.find(w => x > w.x && x < w.x + w.w && y > w.y && y < w.y + w.h);
const wallOf = i => wallAt(i.x + i.w / 2, i.y + i.w / (i.ar || 1) / 2);
function hang(src) {  // a copy for the wall: the original stays in its section
  const { el: _, x, y, section, ...rest } = src, ar = src.ar || 1;
  const it = { ...rest, id: `hp:${Date.now().toString(36)}:${src.id}`, hp: true, moved: true, section: "Hängeplan",
    x: 0, y: 0, w: Math.round(ar >= 1 ? 594 : 594 * ar) };  // no paper size known: A2 long side
  board.items.push(it); world.insertBefore(it.el = card(it), gX);
  if (it.kind === "pdf" && it.url) getDoc(it.url).then(d => d.getPage(1)).then(p => {
    if (!board.items.includes(it)) return;
    it.w = Math.round(p.getViewport({ scale: 1 }).width * 25.4 / 72); setBox(it); touch(it.id); save();
  }).catch(err => console.warn("pdf", err));
  return it;
}
function guides(w, x, y) {
  const px = 3 / view.s; gX.hidden = x == null; gY.hidden = y == null;
  if (x != null) Object.assign(gX.style, { left: x - px / 2 + "px", top: w.y + "px", width: px + "px", height: w.h + "px" });
  if (y != null) Object.assign(gY.style, { left: w.x + "px", top: y - px / 2 + "px", width: w.w + "px", height: px + "px" });
}
function snap(it, w) {  // edges, centres and the gaps already used on this wall; within 12 screen px
  const H = it.w / (it.ar || 1), t = 12 / view.s;
  const os = board.items.filter(o => o !== it && o.kind !== "stack" && wallOf(o) === w).map(o => ({ x: o.x, y: o.y, w: o.w, h: o.w / (o.ar || 1) }));
  const gx = [GAP], gy = [GAP];
  for (const p of os) for (const q of os) {
    if (p.y < q.y + q.h && q.y < p.y + p.h && q.x > p.x + p.w) gx.push(q.x - p.x - p.w);
    if (p.x < q.x + q.w && q.x < p.x + p.w && q.y > p.y + p.h) gy.push(q.y - p.y - p.h);
  }
  const cx = [[w.x + w.w / 2, .5]], cy = [[w.y + w.h - EYE, .5]];  // [where, which part of the sheet: 0 start, .5 centre, 1 end]
  for (const o of os) {
    cx.push([o.x, 0], [o.x + o.w, 1], [o.x + o.w / 2, .5], [o.x, 1], [o.x + o.w, 0]);
    cy.push([o.y, 0], [o.y + o.h, 1], [o.y + o.h / 2, .5], [o.y, 1], [o.y + o.h, 0]);
    if (o.y < it.y + H && it.y < o.y + o.h) for (const g of gx) cx.push([o.x + o.w + g, 0], [o.x - g, 1]);  // same row
    if (o.x < it.x + it.w && it.x < o.x + o.w) for (const g of gy) cy.push([o.y + o.h + g, 0], [o.y - g, 1]);  // same column
  }
  const best = (c, p, s) => c.reduce((b, [v, k]) => { const d = Math.abs(v - p - k * s); return d < b.d ? { d, to: v - k * s, line: v } : b; }, { d: t });
  const bx = best(cx, it.x, it.w), by = best(cy, it.y, H);
  if (bx.to != null) it.x = bx.to;
  if (by.to != null) it.y = by.to;
  guides(w, bx.line, by.line);
}

function editDrag(e) {
  const rz = e.target.closest(".rz"), c = e.target.closest(".card"), lab = e.target.closest(".label:not(.wt)");
  let before;  // set on the first move, so a plain click changes nothing
  if (c) {
    let it = c.item, rx = it.x, ry = it.y, hung = false;  // rx/ry: where the pointer put it, before snapping
    return { move(dx, dy, ev) {
      before ??= { x: it.x, y: it.y, w: it.w, moved: it.moved }; touch(it.id);
      if (rz) { it.w = Math.max(60, it.w + dx); setBox(it); return; }
      rx += dx; ry += dy;
      const h = it.w / (it.ar || 1), w = wallAt(rx + it.w / 2, ry + h / 2);
      if (w && !it.hp && !hung && it.kind !== "stack") {
        const cx = rx + it.w / 2, cy = ry + h / 2;
        Object.assign(it, before); setBox(it);
        it = hang(it); rx = cx - it.w / 2; ry = cy - it.w / (it.ar || 1) / 2; hung = true; touch(it.id);
      }
      it.x = rx; it.y = ry;
      if (w && !ev?.altKey) snap(it, w); else guides();  // Alt: place freely
      setBox(it);
    }, end() {
      guides();
      if (!before) return select(c, e);  // not moved: a click
      it.x = Math.round(it.x); it.y = Math.round(it.y); it.w = Math.round(it.w);
      if (hung) remember(it.id);
      else if (it.hp && !rz && !wallOf(it)) {  // dragged off the wall: the copy goes
        gone.add(it.id); it.el.remove(); board.items.splice(board.items.indexOf(it), 1);
        remember(it.id, null, Object.assign(it, before));
      } else { it.moved = true; remember(it.id, before); }
      save();
    } };
  }
  if (lab && !lab.isContentEditable) {
    const l = lab.lab;
    return { move(dx, dy) { before ??= { x: l.x, y: l.y, moved: l.moved }; touch(l.id); l.x += dx; l.y += dy; lab.style.left = l.x + "px"; lab.style.top = l.y + "px"; },
      end() { if (!before) return; l.x = Math.round(l.x); l.y = Math.round(l.y); l.moved = true; remember(l.id, before); save(); } };
  }
  return null;
}
{  // edit controls: everything stays locked until the lock button is clicked
  const icon = shackle => `<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" style="display:block"><rect x="5" y="11" width="14" height="10"/><path d="${shackle}"/></svg>`;
  const LOCKED = icon("M8 11V7a4 4 0 0 1 8 0v4"), OPEN = icon("M8 11V7a4 4 0 0 1 7.5-1.9");
  const lock = el("button", "", LOCKED); lock.id = "lock"; lock.title = "Zum Bearbeiten entsperren"; btn.hidden = true;
  lock.onclick = () => {
    if (!editing && REPO && !login()) return;  // editing online needs the shared token
    editing = !editing;
    document.body.classList.toggle("edit", editing);
    lock.innerHTML = editing ? OPEN : LOCKED; lock.title = editing ? "Sperren" : "Zum Bearbeiten entsperren";
    btn.hidden = add.hidden = !editing; undoBtn.hidden = !editing || !undos.length;
    if (!editing) select({});
  };
  document.body.append(lock, btn, undoBtn);
  undoBtn.onclick = undo;
  addEventListener("keydown", e => {
    if (editing && ov.hidden && (e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === "z" && !e.target.isContentEditable) { e.preventDefault(); undo(); }
  });
  world.addEventListener("dblclick", e => {
    const wt = editing && e.target.closest(".wt");
    if (wt) {  // wall size in metres
      const w = wt.parentNode.wl, s = prompt("Wand in m (Breite × Höhe):", `${m2(w.w)} × ${m2(w.h)}`);
      const [a, b] = (s || "").replace(/,/g, ".").match(/\d+(\.\d+)?/g) || [];
      if (+a > 0 && +b > 0) { w.w = Math.round(a * 1000); w.h = Math.round(b * 1000); w.el.replaceWith(wallEl(w)); touch(w.id); save(); }
      return;
    }
    const lab = editing && e.target.closest(".label"); if (!lab) return;
    const before = { text: lab.lab.text };
    touch(lab.lab.id); lab.contentEditable = "true"; lab.focus();
    lab.onblur = () => {
      lab.contentEditable = "false"; lab.lab.text = lab.textContent.trim(); touch(lab.lab.id);
      if (lab.lab.text !== before.text) remember(lab.lab.id, before);
      save();
    };
  });
  btn.onclick = () => {
    if (REPO) return save(true);
    // local: hand the file over
    const json = JSON.stringify({ walls: board.walls.map(strip), labels: board.labels.map(strip), items: board.items.map(strip) }, null, 1);
    Object.assign(el("a"), { href: URL.createObjectURL(new Blob([json], { type: "application/json" })), download: "board.json" }).click();
  };
  world.addEventListener("contextmenu", e => {  // right click on a card: replace it with another file
    const c = editing && e.target.closest(".card"); if (!c || c.item.kind === "stack") return;
    e.preventDefault();
    if (!REPO) { btn.textContent = "Ersetzen geht nur online"; return; }
    const inp = Object.assign(el("input"), { type: "file" }), old = c.item;
    inp.onchange = async () => {
      if (!inp.files[0]) return;
      btn.textContent = "Ersetzt …";
      try { await upload(inp.files[0], old.x, old.y, old); } catch (err) { btn.textContent = `Fehler: ${err.message}`; }
    };
    inp.click();
  });
  host.addEventListener("dragover", e => e.preventDefault());
  // files from a drop, Strg+V or the + button: side by side from x, y (board coordinates)
  async function place(files, x, y) {
    if (!files.length) return;
    if (!REPO) { btn.textContent = "Hochladen geht nur online"; return; }
    for (const [i, f] of files.entries()) {
      btn.textContent = `Lädt hoch … ${i + 1}/${files.length}`;
      try { x += await upload(f, x, y) + 40; } catch (err) { btn.textContent = `Fehler: ${err.message}`; return; }
    }
  }
  const at = (cx, cy) => { const r = host.getBoundingClientRect(); return [(cx - r.left - view.x) / view.s, (cy - r.top - view.y) / view.s]; };
  const mid = () => { const r = host.getBoundingClientRect(); return at(r.left + r.width / 2, r.top + r.height / 2); };
  host.addEventListener("drop", e => {
    e.preventDefault();
    if (editing) place([...e.dataTransfer.files], ...at(e.clientX, e.clientY));  // the list empties once the event is over
  });
  addEventListener("paste", e => {
    if (!editing || e.target.isContentEditable) return;
    // a pasted screenshot has no real name: give it a dated one
    const files = [...e.clipboardData.files].map(f => /^image\.\w+$/.test(f.name)
      ? new File([f], `Einfuegen_${new Date().toISOString().slice(0, 19).replace(/\D/g, "")}.${f.type.split("/")[1]}`, { type: f.type }) : f);
    if (files.length) { e.preventDefault(); place(files, ...mid()); return; }
    const text = e.clipboardData.getData("text/plain");
    if (text.startsWith(CLIP)) { e.preventDefault(); paste(JSON.parse(text.slice(CLIP.length))); }
  });
  // Strg+C puts the selected cards on the system clipboard as a marker + their data, so pasting works in another tab too
  const CLIP = "tib-board:";
  addEventListener("copy", e => {
    if (!editing || !sel.size || e.target.isContentEditable) return;
    e.preventDefault();
    e.clipboardData.setData("text/plain", CLIP + JSON.stringify([...sel].map(strip)));
  });
  // copies point at the same files (nothing uploaded again) and sit together in the middle of the view
  function paste(items) {
    const x0 = Math.min(...items.map(i => i.x)), y0 = Math.min(...items.map(i => i.y));
    const w = Math.max(...items.map(i => i.x + i.w)) - x0, h = Math.max(...items.map(i => i.y + i.w / (i.ar || 1))) - y0;
    const [mx, my] = mid(), stamp = Date.now().toString(36);
    select({});
    items.forEach((o, n) => {
      const it = { ...o, id: o.id.replace(/[^/]*$/, `kopie-${stamp}${n}/$&`), moved: true, upload: true,
        x: Math.round(mx - w / 2 + o.x - x0), y: Math.round(my - h / 2 + o.y - y0) };
      touch(it.id); board.items.push(it); world.append(it.el = card(it)); remember(it.id);
      if (it.kind === "model" && it.url) io.observe(it.el.querySelector(".media"));
      select(it.el, { shiftKey: true });
    });
    save(true);
  }
  const pick = Object.assign(el("input"), { type: "file", multiple: true, hidden: true });
  const add = el("button", "", "+"); add.id = "add"; add.title = "Datei hochladen (oder hineinziehen / Strg+V)"; add.hidden = true;
  add.onclick = () => pick.click();
  pick.onchange = () => { place([...pick.files], ...mid()); pick.value = ""; };
  document.body.append(add, pick);
  addEventListener("beforeunload", e => { if (REPO && (dirty.size || saving)) e.preventDefault(); });
}
</script>
